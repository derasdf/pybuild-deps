name: Release

on:
  release:
    types: [released]

  # Re-run a failed release by hand. Dispatch from the tag; a branch fails the version check.
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pybuild-deps
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write # Required for pushing tags - https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#permissions
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"

      - name: Check if there is a parent commit
        id: check-parent-commit
        run: |
          echo "sha=$(git rev-parse --verify --quiet HEAD^)" >> $GITHUB_OUTPUT

      - name: Check version
        id: check-version
        if: steps.check-parent-commit.outputs.sha
        run: |
          echo "version=$(uv version --short)" >> $GITHUB_OUTPUT

      - name: Tag new version if it doesn't exist
        id: tag-version
        if: steps.check-version.outputs.version
        env:
          TAG: ${{ steps.check-version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists, skipping."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: |
          uv build

      - name: Publish package on PyPI
        if: steps.tag-version.outputs.tag
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
